<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Trái tim</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .chu {
    position: fixed;
    left: 0; right: 0;
    top: 50%;
    transform: translateY(-50%);
    margin: 0;
    padding: 0 16px;
    color: #ffd6ec;
    text-align: center;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(18px, 6vw, 36px);
    font-weight: 700;
    line-height: 1.4;
    text-shadow: 0 0 8px #ff4fa3, 0 0 20px #e80c29;
    pointer-events: none;
    z-index: 2;
  }
</style>
</head>
<body>
<canvas id="pinkboard"></canvas>
<h1 class="chu">Tui xin lỗi :(<br>Đừng giận tui nha</h1>
<script>
var settings = {
  particles: {
    length: 500,
    duration: 2,
    velocity: 100,
    effect: -0.75,
    size: 30
  }
};

var Point = (function () {
  function Point(x, y) {
    this.x = (typeof x !== 'undefined') ? x : 0;
    this.y = (typeof y !== 'undefined') ? y : 0;
  }
  Point.prototype.clone = function () { return new Point(this.x, this.y); };
  Point.prototype.length = function (length) {
    if (typeof length == 'undefined') return Math.sqrt(this.x * this.x + this.y * this.y);
    this.normalize();
    this.x *= length;
    this.y *= length;
    return this;
  };
  Point.prototype.normalize = function () {
    var length = this.length();
    this.x /= length;
    this.y /= length;
    return this;
  };
  return Point;
})();

// viewScale: scales the whole effect to fit the screen
var viewScale = 1;

var Particle = (function () {
  function Particle() {
    this.position = new Point();
    this.velocity = new Point();
    this.acceleration = new Point();
    this.age = 0;
  }
  Particle.prototype.initialize = function (x, y, dx, dy) {
    this.position.x = x;
    this.position.y = y;
    this.velocity.x = dx;
    this.velocity.y = dy;
    this.acceleration.x = dx * settings.particles.effect;
    this.acceleration.y = dy * settings.particles.effect;
    this.age = 0;
  };
  Particle.prototype.update = function (dt) {
    this.position.x += this.velocity.x * dt;
    this.position.y += this.velocity.y * dt;
    this.velocity.x += this.acceleration.x * dt;
    this.velocity.y += this.acceleration.y * dt;
    this.age += dt;
  };
  Particle.prototype.draw = function (context, image) {
    function ease(t) { return (--t) * t * t + 1; }
    var size = settings.particles.size * viewScale * ease(this.age / settings.particles.duration);
    context.globalAlpha = Math.max(0, 1 - this.age / settings.particles.duration);
    context.drawImage(image, this.position.x - size / 2, this.position.y - size / 2, size, size);
  };
  return Particle;
})();

var ParticlePool = (function () {
  var particles, firstActive = 0, firstFree = 0, duration = settings.particles.duration;

  function ParticlePool(length) {
    particles = new Array(length);
    for (var i = 0; i < particles.length; i++) particles[i] = new Particle();
  }
  ParticlePool.prototype.add = function (x, y, dx, dy) {
    particles[firstFree].initialize(x, y, dx, dy);
    firstFree++;
    if (firstFree == particles.length) firstFree = 0;
    if (firstActive == firstFree) firstActive++;
    if (firstActive == particles.length) firstActive = 0;
  };
  ParticlePool.prototype.update = function (dt) {
    var i;
    if (firstActive < firstFree) {
      for (i = firstActive; i < firstFree; i++) particles[i].update(dt);
    }
    if (firstFree < firstActive) {
      for (i = firstActive; i < particles.length; i++) particles[i].update(dt);
      for (i = 0; i < firstFree; i++) particles[i].update(dt);
    }
    while (firstActive != firstFree && particles[firstActive].age >= duration) {
      firstActive++;
      if (firstActive == particles.length) firstActive = 0;
    }
  };
  ParticlePool.prototype.draw = function (context, image) {
    var i;
    if (firstActive < firstFree) {
      for (i = firstActive; i < firstFree; i++) particles[i].draw(context, image);
    }
    if (firstFree < firstActive) {
      for (i = firstActive; i < particles.length; i++) particles[i].draw(context, image);
      for (i = 0; i < firstFree; i++) particles[i].draw(context, image);
    }
  };
  return ParticlePool;
})();

(function (canvas) {
  var context = canvas.getContext('2d'),
      particles = new ParticlePool(settings.particles.length),
      particleRate = settings.particles.length / settings.particles.duration,
      time,
      dpr = 1,
      cssW = 0,
      cssH = 0;

  function pointOnHeart(t) {
    return new Point(
      160 * Math.pow(Math.sin(t), 3),
      130 * Math.cos(t) - 50 * Math.cos(2 * t) - 20 * Math.cos(3 * t) - 10 * Math.cos(4 * t) + 25
    );
  }

  // Heart sprite drawn at 2x resolution so it stays sharp on retina screens
  var image = (function () {
    var c = document.createElement('canvas'),
        ctx = c.getContext('2d'),
        S = settings.particles.size * 3;
    c.width = S;
    c.height = S;
    function to(t) {
      var p = pointOnHeart(t);
      p.x = S / 2 + p.x * S / 350;
      p.y = S / 2 - p.y * S / 350;
      return p;
    }
    ctx.beginPath();
    var t = -Math.PI, p = to(t);
    ctx.moveTo(p.x, p.y);
    while (t < Math.PI) {
      t += 0.01;
      p = to(t);
      ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.fillStyle = '#e80c29';
    ctx.fill();
    return c; // a canvas works directly with drawImage, no async load
  })();

  function render() {
    requestAnimationFrame(render);

    var newTime = Date.now() / 1000,
        deltaTime = newTime - (time || newTime);
    time = newTime;
    if (deltaTime > 0.1) deltaTime = 0.1; // avoid jumps after the tab was in background

    context.setTransform(1, 0, 0, 1, 0, 0);
    context.clearRect(0, 0, canvas.width, canvas.height);
    context.setTransform(dpr, 0, 0, dpr, 0, 0);

    var amount = particleRate * deltaTime;
    for (var i = 0; i < amount; i++) {
      var pos = pointOnHeart(Math.PI - 2 * Math.PI * Math.random());
      var dir = pos.clone().length(settings.particles.velocity * viewScale);
      particles.add(cssW / 2 + pos.x * viewScale, cssH / 2 - pos.y * viewScale, dir.x, -dir.y);
    }

    particles.update(deltaTime);
    particles.draw(context, image);
    context.globalAlpha = 1;
  }

  function onResize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    cssW = window.innerWidth;
    cssH = window.innerHeight;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    // heart + particle spread is about 540px wide at scale 1
    viewScale = Math.min(1.3, Math.min(cssW / 540, cssH / 520));
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 200); });

  onResize();
  render();
})(document.getElementById('pinkboard'));
</script>
</body>
</html>
